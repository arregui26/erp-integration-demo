[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-integration-demo"
version = "0.1.0"
description = "A fictional ERP change feed and a transactional integration connector"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "Carlos Arregui Torres"}]
dependencies = ["fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55", "sqlalchemy>=2.1,<2.2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<0.29", "pydantic-settings>=2.16,<3", "alembic>=1.20,<2"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: uses a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
